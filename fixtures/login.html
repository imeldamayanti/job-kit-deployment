<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Login - uji password</title></head>
  <body>
    <form id="login">
      <label for="e">Email</label><input id="e" name="email" type="email" />
      <label for="p">Password</label><input id="p" name="password" type="password" />
      <button type="submit">Masuk</button>
    </form>
    <script>
      window.__submitted = false
      document.getElementById('login').addEventListener('submit', (e) => { e.preventDefault(); window.__submitted = true })
    </script>
  </body>
</html>
