<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin job-kit</title>
<meta name="description" content="Halaman pribadi pemilik job-kit.">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
<h1>Admin</h1>
<p>Halaman pribadi. Hanya email yang terdaftar sebagai admin yang melihat angka. Tidak ada isi CV atau data pribadi di sini.</p>
<div id="login">
<label for="email">Email admin</label>
<input id="email" type="email" autocomplete="email">
<p><button class="btn" id="send" type="button">Kirim kode</button></p>
<label for="code">Kode dari email</label>
<input id="code" inputmode="numeric" autocomplete="one-time-code">
<p><button class="btn" id="verify" type="button">Masuk</button></p>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div id="out"></div>
<script type="module" src="/admin.js"></script>
</main>
</body>
</html>
